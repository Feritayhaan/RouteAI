# Gece verisi: model senkronu (Artificial Analysis + LMArena -> data/models.json)
# ve kendi sinyallerimiz (KV -> data/signals.json, SADECE okuma).
# Değişiklik varsa sync/nightly-<tarih> dalına commit atar ve PR açar
# (PR gövdesi = sync-report.md + signals-anomalies.md).
# Otomatik merge (Ferit'in kararı, 2026-09-25): katalog kontrolü, testler ve
# build geçer VE scripts/automerge-guard.mjs uygun derse PR kendiliğinden
# squash-merge edilir; Vercel siteyi yeniden yayınlar. Şüpheli durumda (ilk
# senkron, veri dışı dosya, model sayısında >%20 düşüş, güncel modeli kaybolan
# ürün, sinyal anormalliği) PR açık kalır ve sebep PR'a yorum olarak yazılır.
#
# Sessiz başarı yok (scripts/sync/core.mjs → syncExitDecision): LMArena'dan ya da
# anahtarı tanımlı bir kaynaktan (AA, KV) hiç veri gelmezse iş KIRMIZI biter.
# Anahtarı olmayan kaynak "atlandı" sayılır. Kırmızı karar en sonda uygulanır:
# gelen kısmi veri yine PR'a gider ama otomatik merge edilmez. Rapor
# (sync-report.md + signals-anomalies.md) her koşuda iş özetinde görünür.
#
# Gerekenler:
#  - Repo secret: AA_API_KEY (yoksa Artificial Analysis atlanır, LMArena yine çalışır)
#  - Repo secret: KV_REST_API_URL + KV_REST_API_READ_ONLY_TOKEN (yoksa sinyal adımı atlanır)
#  - Settings > Actions > General > "Allow GitHub Actions to create and approve
#    pull requests" açık olmalı; yoksa `gh pr create` 403 döner.
# Not: GITHUB_TOKEN ile açılan PR başka workflow'ları tetiklemez.
# Sadece GitHub'ın kendi action'ları kullanılıyor (actions/checkout, actions/setup-node).

name: nightly-data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Rapor dosyaları repoda da durabilir; iş özetine sadece bu koşuda yazılanlar girsin.
      - name: Başlangıç işareti
        run: touch "$RUNNER_TEMP/nightly-start"

      - name: Modelleri senkronla
        id: sync
        continue-on-error: true # kırmızı karar son adımda uygulanır
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: npm run sync:models

      - name: Sinyalleri topla (KV'den sadece okuma)
        id: signals
        continue-on-error: true # kırmızı karar son adımda uygulanır
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.KV_REST_API_READ_ONLY_TOKEN }}
        run: npm run aggregate:signals

      - name: Raporu iş özetine yaz
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SIGNALS_OUTCOME: ${{ steps.signals.outcome }}
        run: |
          START="$RUNNER_TEMP/nightly-start"
          {
            if [ -f data/sync-report.md ] && [ data/sync-report.md -nt "$START" ]; then
              cat data/sync-report.md
            else
              echo "# Model senkron raporu"
              echo
              echo "data/sync-report.md bu koşuda yazılmadı (adım sonucu: ${SYNC_OUTCOME}). Ayrıntı: 'Modelleri senkronla' adımının logu."
            fi
            echo
            echo "---"
            echo
            if [ -f data/signals-anomalies.md ] && [ data/signals-anomalies.md -nt "$START" ]; then
              cat data/signals-anomalies.md
            elif [ "$SIGNALS_OUTCOME" = "success" ]; then
              echo "# Sinyaller"
              echo
              echo "Atlandı: KV_REST_API_URL + KV_REST_API_READ_ONLY_TOKEN secret'ı tanımlı değil (hata sayılmaz)."
            else
              echo "# Sinyaller"
              echo
              echo "HATA: KV okunamadı (adım sonucu: ${SIGNALS_OUTCOME}); data/signals.json değiştirilmedi. Ayrıntı: 'Sinyalleri topla' adımının logu."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kataloğu doğrula
        run: npm run validate:catalog

      - name: Testler
        run: npm test

      - name: Build (site yeni veriyle derleniyor mu)
        run: npm run build

      - name: Değişiklik varsa PR aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SIGNALS_OUTCOME: ${{ steps.signals.outcome }}
        run: |
          if git diff --quiet -- data/models.json data/signals.json; then
            echo "data/models.json ve data/signals.json değişmedi; PR yok."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/nightly-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Otomatik merge kararı commit'ten ÖNCE (çalışma kopyası vs main)
          if npm run --silent automerge:guard > /tmp/guard.txt 2>&1; then AUTO=1; else AUTO=0; fi
          # Bir kaynak kırmızı bittiyse kısmi veri PR'a gider ama otomatik merge edilmez.
          if [ "$SYNC_OUTCOME" != "success" ] || [ "$SIGNALS_OUTCOME" != "success" ]; then
            AUTO=0
            { echo "Otomatik merge edilmedi: gece işi kırmızı (senkron: ${SYNC_OUTCOME}, sinyaller: ${SIGNALS_OUTCOME}); kararın gerekçesi data/sync-report.md → 'Karar' ve iş özetinde."
              echo
              cat /tmp/guard.txt
            } > /tmp/guard-full.txt
            mv /tmp/guard-full.txt /tmp/guard.txt
          fi
          cat /tmp/guard.txt
          git checkout -b "$BRANCH"
          for f in data/models.json data/sync-report.md data/signals.json data/signals-anomalies.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "sync: gece verisi ${DATE}"
          git push --force-with-lease origin "$BRANCH"
          { cat data/sync-report.md; echo; cat data/signals-anomalies.md 2>/dev/null; } > /tmp/pr-body.md
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "sync: gece verisi ${DATE}" --body-file /tmp/pr-body.md
          fi
          if [ "$AUTO" = "1" ]; then
            gh pr merge "$BRANCH" --squash --delete-branch \
              || gh pr comment "$BRANCH" --body "Otomatik merge denendi ama olmadı (dal koruması olabilir); elle merge et."
          else
            gh pr comment "$BRANCH" --body-file /tmp/guard.txt
          fi

      # Sessiz başarı yok: senkron ya da sinyal adımı kırmızı kararla bittiyse iş de kırmızı.
      - name: Kaynak kararı
        if: steps.sync.outcome == 'failure' || steps.signals.outcome == 'failure'
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SIGNALS_OUTCOME: ${{ steps.signals.outcome }}
        run: |
          echo "::error::Gece verisi eksik: senkron=${SYNC_OUTCOME}, sinyaller=${SIGNALS_OUTCOME}. Gerekçe iş özetinde (data/sync-report.md → Karar)."
          exit 1
