# Aylık fiyat kontrolü: aktif ürünlerin pricingUrl sayfaları -> products.json
# önerileri + data/price-report.md. Fark varsa prices/<tarih> dalına PR.
# priceCheckedAt sadece PR merge edilince güncellenmiş sayılır.
#
# Secret: OPENAI_API_KEY (yoksa sadece "pricingUrl yok" raporu).
# Settings > Actions > "Allow GitHub Actions to create and approve pull requests" açık olmalı.
# Sadece GitHub'ın kendi action'ları kullanılıyor.

name: check-prices

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fiyatları kontrol et
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run check:prices
      - name: Kataloğu doğrula
        run: npm run validate:catalog
      - name: Fark varsa PR aç
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/products.json; then
            echo "Fiyat önerisi yok; PR yok."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="prices/${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/products.json data/price-report.md
          git commit -m "prices: aylık kontrol ${DATE}"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "prices: aylık kontrol ${DATE}" --body-file data/price-report.md
